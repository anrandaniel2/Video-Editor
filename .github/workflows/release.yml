# Release pipeline: pushing a version tag (v0.0.1-beta, v0.2.0, v1.0.0-rc.1, …) builds the APK (for
# 64-bit ARM phones) signed with the release key and makes it a draft GitHub release named after the
# tag, with an empty "What's Changed" section. Fill that in on GitHub and publish the draft: it
# becomes the latest release (betas too: while the app is in beta, every release is one).
#
# A manual run (Actions › Release › Run workflow) is a dry run: it builds the APK at the version in
# gradle.properties and keeps it as the run's artifact. A dry run is still release-signed: with the
# release secrets it uses the release key, and without them it falls back to the public test key in
# .github/signing (see its README). That key is not the published one, so its APK installs fresh but
# cannot update a published build, and vice versa.
#
# Which key:
#   v* tags            the release key, always. A tag without it fails the run rather than publish
#                      an APK that cannot update installed copies.
#   dryrun-* tags      the public test key, always, and the tag drafts a release named after the
#                      tag (dryrun-0.0.61-beta). The name is not a version, so the F-Droid recipe
#                      and the update check (they read version tags) never see it.
#   branches, manual   the release key when the secrets are here, else the public test key; a
#                      manual run can also ask for the public key (signing: public).
name: Release

on:
  push:
    branches:
      - 'arena/694df4ef-video-editor'
      # each Arena session's branch: a push here builds a dry-run APK
      - 'arena/aa65d60d-video-editor'
      - 'arena/c6cc15fc-video-editor'
      # a release tag drafts a release; dryrun-<version> drafts one signed with the public key
    tags: ['v*', 'dryrun-*']
  workflow_dispatch:
    inputs:
      signing:
        description: 'Key: auto = the release key if configured, else the public test key; public = the public test key (drafts nothing)'
        type: choice
        options: [auto, public]
        default: auto

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # never cancel a release halfway; a newer push waits its turn
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The engine's own tests. They had never run: this workflow only built the APK, so a test could
  # not fail and could not catch anything. Host builds (x86_64 Linux) are what cargo test can run —
  # the Android targets are cross-compiled and cannot execute on the runner.
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: tests

      # The photo engine's own module first: it is the one this branch added, and its failures are
      # the ones that matter most here.
      - name: The photo engine
        run: |
          set +e
          # `--lib`: the tests live in the library, and without it cargo also looks for test
          # targets (none exist) before deciding what to run. The filter is the module path.
          cargo test -p filmcraft-android --lib 'photocraft::tests::' -- --nocapture > /tmp/raw.txt 2>&1
          status=$?
          # Strip the colour codes first: cargo emits them here, and `^error` does not match
          # "\x1b[1m\x1b[91merror". That is exactly how this step failed silently twice.
          sed 's/\x1b\[[0-9;]*m//g' /tmp/raw.txt > /tmp/photo-tests.txt
          # How many ran, so a compile failure cannot be mistaken for a failing test.
          grep -E '^running [0-9]+ tests?$' /tmp/photo-tests.txt | tail -1 | while read -r line; do
            echo "::warning title=Ran::$line"
          done
          # A compile error has no failing test to name, so the errors themselves come back as
          # annotations: the step log is not readable from where this is watched.
          # Each error with the line it points at, as one annotation. Separate lists lose the
          # pairing: an annotation queue is capped, so the locations arrive without their errors
          # and the diagnosis is a guess. That is what happened here.
          awk '/^error(\[E[0-9]+\])?: /{e=$0; getline; if ($0 ~ /^[[:space:]]*--> /) {gsub(/^[[:space:]]+--> /,""); print e " @ " $0} else print e}' /tmp/photo-tests.txt | head -25 | while IFS= read -r line; do
            echo "::error title=Compile::$line"
          done
          # Only what failed, and its message: `ok` lines crowd out the one line that names the
          # failing test, and annotations are capped.
          grep -E '^test .* FAILED$|^---- .* stdout ----$|^failures:$|panicked at|^assertion|^  left:|^ right:|^thread .* panicked' /tmp/photo-tests.txt | head -30 | while read -r line; do
            echo "::error title=Test::$line"
          done
          # And the failing test's own stdout, which states left and right.
          sed -n '/^---- .* stdout ----$/,/^$/p' /tmp/photo-tests.txt > /tmp/fail.txt
          head -30 /tmp/fail.txt | while read -r line; do
            echo "::error title=Detail::$line"
          done
          # And the whole output in the summary, which renders.
          if [ $status -ne 0 ]; then
            {
              echo "## The photo engine did not build or pass (status $status)"
              echo '```'
              head -c 60000 /tmp/photo-tests.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      # Split out, because a failing test names a test and that name is the whole diagnosis. The
      # step log is not always readable from the API, but a failure annotation is.
      - name: The whole engine
        run: |
          set +e
          cargo test -p filmcraft-android > /tmp/engine-tests.txt 2>&1
          status=$?
          # One annotation per failing test, and one per panic line: the name says which test, the
          # panic says why. Test names are module paths (`mod::test`), so colons must be allowed.
          # The step log cannot be read back through the API here, but annotations can.
          awk '/^failures:$/{f=1;next} f&&/^ *[a-zA-Z_0-9:]+$/{print $1} f&&/^$/{f=0}' /tmp/engine-tests.txt | sort -u | while read -r name; do
            echo "::error title=Failing test::$name"
          done
          # Everything printed between `---- name stdout ----` and the end of that test's output:
          # the panic sits on line two, and the message on the lines after it.
          awk '/^---- .* stdout ----$/{p=1; n=0; next} p&&n<6{print; n++}' /tmp/engine-tests.txt | head -24 | while read -r line; do
            echo "::warning title=Why::$line"
          done
          exit $status

  # TEMPORARY: render the brush sheet so the drawing can be looked at rather than imagined.
  brush-sheet:
    name: Brush sheet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests
      - name: Render
        run: cargo run -p filmcraft-android --example brush_sheet
      # The artifact host is not reachable from the workstation that reads this, so the image is
      # printed into the log in a form that survives the log's own escaping.
      - name: Print the sheet
        run: |
          python3 - <<'PYIMG'
          import base64, zlib, struct
          data = open('brush_sheet.png','rb').read()
          print('PNG-LEN', len(data))
          print('PNG-B64', base64.b64encode(data).decode())
          PYIMG

  apk:
    name: APK
    runs-on: ubuntu-latest
    # what signed it, for the release job's notes (and for anyone reading the API)
    outputs:
      key: ${{ steps.key.outputs.kind }}
    steps:
      - uses: actions/checkout@v7

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^filmcraft\.version=//p' apps/filmcraft-android/android/gradle.properties)"
          v="$listed"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            case "$GITHUB_REF_NAME" in
              # a public-key draft: the tag reads dryrun-<version>, the build is <version>
              dryrun-*) v="${GITHUB_REF_NAME#dryrun-}" ;;
              *) v="${GITHUB_REF_NAME#v}" ;;
            esac
          fi
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-beta"
            exit 1
          fi
          # the tag must be the version gradle.properties names (F-Droid builds from that file)
          if [ "$v" != "$listed" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but gradle.properties says filmcraft.version=$listed: set it (and filmcraft.versionCode) before tagging"
            exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "### $GITHUB_REF_NAME (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # the Rust release and targets rust-toolchain.toml names
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android
          workspaces: |
            . -> target
            third_party/procraft -> target

      # cargo-ndk builds both Rust halves of the APK: FilmCraft's own and :procraft's. Both are
      # cached (the tool with its own key, the NDK by the sdkmanager's own cache), so a rebuild of
      # the same branch does not compile the tool from source or download 700 MB again.
      - name: The Android NDK
        run: |
          if [ -d "$ANDROID_HOME/ndk/29.0.14206865" ]; then
            echo "::notice::The NDK 29.0.14206865 is already installed."
          else
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null
          fi

      - name: Install cargo-ndk
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      # Gradle's own caches (configuration, Kotlin incremental compilation, the build cache). The
      # Rust half dominates a cold run, but a warm one still reconfigures both projects and
      # recompiles Kotlin from scratch without this.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # The key: the public test key when asked for and when the release key is unavailable, the
      # release key otherwise. A version tag with no release key is an error: its APK could not
      # update installed copies, which is what a release promises.
      # Public signing is explicitly permitted by the repository owner.
      - name: Release key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.FILMCRAFT_KEYSTORE_BASE64 }}
          WANT_SIGNING: ${{ inputs.signing }}
        run: |
          want=auto
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            case "$GITHUB_REF_NAME" in dryrun-*) want=public ;; esac
          fi
          # a manual run asks (signing: public); the version tag never does
          if [ "$WANT_SIGNING" = public ] && [ "$GITHUB_REF_TYPE" != tag ]; then want=public; fi
          if [ "$want" != public ] && [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.p12"
            echo "kind=release" >>"$GITHUB_OUTPUT"
            echo "::notice::Using the release signing key."
          else
            if [ "$GITHUB_REF_TYPE" = tag ] && [ "$want" != public ]; then
              echo "::error::$GITHUB_REF_NAME is a release tag but the release key is not configured:"
              echo "::error::add FILMCRAFT_KEYSTORE_BASE64 (and the password, alias and key password secrets),"
              echo "::error::or push a dryrun-$GITHUB_REF_NAME tag to draft a build signed with the public key."
              exit 1
            fi
            cp .github/signing/dryrun-release.p12 "$RUNNER_TEMP/release.p12"
            echo "kind=dryrun" >>"$GITHUB_OUTPUT"
            echo "::notice::Using the stable public CI signing key."
          fi
          echo "FILMCRAFT_KEYSTORE=$RUNNER_TEMP/release.p12" >>"$GITHUB_ENV"

      # The APK is built unsigned, exactly as F-Droid builds it, and a later step signs it.
      #
      # The Gradle daemon stays on (`--no-daemon` would make the second run, below, start from
      # cold: a JVM, the Kotlin compiler and the whole configuration again). CI's runner is
      # discarded after the job, so there is nothing to leave behind.
      - name: Build
        working-directory: apps/filmcraft-android/android
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set +e
          ./gradlew assembleRelease "-Pfilmcraft.abis=arm64-v8a" "-Pfilmcraft.version=$VERSION" \
            -Pfilmcraft.unsigned=true --build-cache > /tmp/android-build.log 2>&1
          rc=$?
          cat /tmp/android-build.log
          if [ "$rc" -ne 0 ]; then
            tail -120 /tmp/android-build.log >> "$GITHUB_STEP_SUMMARY"
            # Every compiler error as its own annotation, so a long list is not cut to its tail.
            python3 "$GITHUB_WORKSPACE/.github/scripts/build-log-annotations.py" /tmp/android-build.log 120
            exit "$rc"
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/dist/filmcraft-android-$VERSION.apk"

      # v0.0.1-beta was signed with an older key (CN=LightCraft for Android). Every APK since carries
      # the lineage that hands it over to the shared artcraft-android key (APK Signature Scheme v3),
      # so installed copies update. v3 alone: the app needs Android 10 and v3 works from Android 9,
      # while v2 would need the old key and F-Droid refuses an APK whose v2 and v3 keys differ. The
      # ZIP layout stays Gradle's, so F-Droid can copy this signature onto its own build.
      # The dry-run key is a key of its own, not a rotation of the published one, so it carries no
      # lineage. A dry run's artifact signs v2 + v3 (the app needs Android 10; v1 and v4 add
      # nothing); a dryrun- tag drafts a release, and a release APK signs v3 alone, so its one
      # certificate is the one F-Droid's checker names.
      - name: Sign
        env:
          KEY_KIND: ${{ steps.key.outputs.kind }}
          FILMCRAFT_KEYSTORE_PASSWORD: ${{ secrets.FILMCRAFT_KEYSTORE_PASSWORD }}
          FILMCRAFT_KEY_ALIAS: ${{ secrets.FILMCRAFT_KEY_ALIAS }}
          FILMCRAFT_KEY_PASSWORD: ${{ secrets.FILMCRAFT_KEY_PASSWORD }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          if [ "$KEY_KIND" = dryrun ]; then
            FILMCRAFT_KEY_ALIAS=filmcraft-dryrun
            FILMCRAFT_KEYSTORE_PASSWORD=filmcraft-dryrun
            FILMCRAFT_KEY_PASSWORD=filmcraft-dryrun
          fi
          extra=(--v2-signing-enabled true --v3-signing-enabled true)
          if [ "$KEY_KIND" = dryrun ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            extra=(--v3-signing-enabled true)
          fi
          for apk in dist/*.apk; do
            "$apksigner" sign --ks "$FILMCRAFT_KEYSTORE" --ks-key-alias "$FILMCRAFT_KEY_ALIAS" \
              --ks-pass env:FILMCRAFT_KEYSTORE_PASSWORD --key-pass env:FILMCRAFT_KEY_PASSWORD \
              --v1-signing-enabled false --v4-signing-enabled false --alignment-preserved true \
              "${extra[@]}" "$apk"
            "$apksigner" verify --verbose "$apk"
          done

      - name: APK
        env:
          KEY_KIND: ${{ steps.key.outputs.kind }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          echo >>"$GITHUB_STEP_SUMMARY"
          for apk in dist/*.apk; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            label=" (public test key)"
            if [ "$KEY_KIND" = release ]; then
              label=""
              # the lineage must name v0.0.1-beta's key, or installed copies can't update
              if ! "$apksigner" lineage --in "$apk" --print-certs | grep -q "CN=LightCraft for Android"; then
                echo "::error::$apk has no lineage from the old key"
                exit 1
              fi
            else
              # a public-key draft carries no lineage, so installs update nothing: say so on the
              # release itself, where someone downloading it will look
              if [ "$GITHUB_REF_TYPE" = tag ]; then
                label=" (public test key, not the published key)"
                {
                  echo "### Public-key draft"
                  echo
                  echo "Signed with the public test key in \`.github/signing/\` (certificate above),"
                  echo "not the published one. It installs on its own — uninstall any published copy"
                  echo "first — and does not update or replace a published build."
                } >>"$GITHUB_STEP_SUMMARY"
              fi
            fi
            sha="$(sha256sum "$apk" | cut -d' ' -f1)"
            {
              echo "    $(basename "$apk")$label"
              grep "certificate SHA-256" <<<"$certs" | sed 's/^/      /'
              echo "      sha256: $sha"
            } >>"$GITHUB_STEP_SUMMARY"
            # Also an annotation: the summary is only on the run page, this is readable from the
            # API and from the file list, so the signing identity is easy to check.
            who="$(sed -n 's/.*certificate DN: //p' <<<"$certs" | head -n 1)"
            fp="$(sed -n 's/.*certificate SHA-256 digest: //p' <<<"$certs" | head -n 1)"
            echo "::notice title=APK signed$label::$(basename "$apk") — $who — cert SHA-256 $fp — APK SHA-256 $sha"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: dist/*
          if-no-files-found: error

      - name: Preserve resolved dependency lock
        uses: actions/upload-artifact@v7
        with:
          name: dependency-lock
          path: Cargo.lock

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

  release:
    name: GitHub Release
    needs: apk
    # a version tag drafts the release; so does a dryrun- tag, ahead of its F-Droid entry
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: dist

      - name: Draft the release
        env:
          KEY_KIND: ${{ needs.apk.outputs.key }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          echo "## What's Changed" >"$notes"
          title="$GITHUB_REF_NAME"
          if [ "$KEY_KIND" = dryrun ]; then
            # a dryrun- tag: say, in the release itself, what this build is and is not
            {
              echo
              echo "---"
              echo
              echo "**Built from \`$GITHUB_REF_NAME\`.** The APK is signed with the *public test key*"
              echo "\`.github/signing/dryrun-release.p12\` (certificate SHA-256"
              echo "\`b75617b60b055b3b02ff599744c69ddebe545a60ed305333f4fc442a9a27bcc0\`), not the published"
              echo "artcraft-android key. It installs on its own — uninstall any published copy first —"
              echo "and it neither updates nor replaces a published build. It is not a release: no"
              echo "version tag points at it, and the F-Droid recipe's update check reads v* tags"
              echo "only (\`UpdateCheckMode: Tags ^v\`), so it is never offered as an update."
            } >>"$notes"
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$title" --notes-file "$notes" -- dist/*
          echo "Draft **$GITHUB_REF_NAME** is ready: fill in What's Changed and publish it." >>"$GITHUB_STEP_SUMMARY"
