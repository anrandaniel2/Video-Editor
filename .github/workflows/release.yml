# Release pipeline: pushing a version tag (v0.0.1-beta, v0.2.0, v1.0.0-rc.1, …) builds the APK (for
# 64-bit ARM phones) signed with the release key and makes it a draft GitHub release named after the
# tag, with an empty "What's Changed" section. Fill that in on GitHub and publish the draft: it
# becomes the latest release (betas too: while the app is in beta, every release is one).
#
# A manual run (Actions › Release › Run workflow) is a dry run: it builds the APK at the version in
# gradle.properties and keeps it as the run's artifact, and releases nothing. A dry run is still
# release-signed: with the release secrets it uses the release key, and without them it falls back
# to the public dry-run key in .github/signing (see its README). That key is not the published one,
# so its APK installs fresh but cannot update a published build, and vice versa.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # never cancel a release halfway; a newer push waits its turn
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^filmcraft\.version=//p' apps/filmcraft-android/android/gradle.properties)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-beta"
            exit 1
          fi
          # the tag must be the version gradle.properties names (F-Droid builds from that file)
          if [ "$v" != "$listed" ]; then
            echo "::error::the tag is v$v but gradle.properties says filmcraft.version=$listed: set it (and filmcraft.versionCode) before tagging"
            exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "### v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # the Rust release and targets rust-toolchain.toml names
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android

      # The rig/animation maths and the GLB parser run against an independent reference
      # implementation in tests/rigging.rs; a red step here is a broken build.
      - name: Model tests
        run: |
          cargo test -p filmcraft-render
          cargo test -p filmcraft-android --lib advanced_model

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null

      # A tag must have the real release key. A branch or manual dry run without the secrets signs
      # with the committed public dry-run key instead, so the artifact is a release build signed
      # the same way (see .github/signing/README.md), never a debug-signed one.
      - name: Release key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.FILMCRAFT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.p12"
            echo "kind=release" >>"$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::No release key: a release is never signed with the public dry-run key"
            exit 1
          else
            cp .github/signing/dryrun-release.p12 "$RUNNER_TEMP/release.p12"
            echo "kind=dryrun" >>"$GITHUB_OUTPUT"
            echo "::notice::No release secrets: signing this dry run with the public dry-run key. Uninstall any published build before installing it."
          fi
          echo "FILMCRAFT_KEYSTORE=$RUNNER_TEMP/release.p12" >>"$GITHUB_ENV"

      # The APK is built unsigned, exactly as F-Droid builds it, and the next step signs it.
      - name: Build
        working-directory: apps/filmcraft-android/android
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          ./gradlew assembleRelease "-Pfilmcraft.abis=arm64-v8a" "-Pfilmcraft.version=$VERSION" \
            -Pfilmcraft.unsigned=true --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/dist/filmcraft-android-$VERSION.apk"

      # v0.0.1-beta was signed with an older key (CN=LightCraft for Android). Every APK since carries
      # the lineage that hands it over to the shared artcraft-android key (APK Signature Scheme v3),
      # so installed copies update. v3 alone: the app needs Android 10 and v3 works from Android 9,
      # while v2 would need the old key and F-Droid refuses an APK whose v2 and v3 keys differ. The
      # ZIP layout stays Gradle's, so F-Droid can copy this signature onto its own build.
      # The dry-run key is a key of its own, not a rotation of the published one, so it carries no
      # lineage and signs v2 + v3 (the app needs Android 10; v1 and v4 add nothing).
      - name: Sign
        env:
          KEY_KIND: ${{ steps.key.outputs.kind }}
          FILMCRAFT_KEYSTORE_PASSWORD: ${{ secrets.FILMCRAFT_KEYSTORE_PASSWORD }}
          FILMCRAFT_KEY_ALIAS: ${{ secrets.FILMCRAFT_KEY_ALIAS }}
          FILMCRAFT_KEY_PASSWORD: ${{ secrets.FILMCRAFT_KEY_PASSWORD }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          if [ "$KEY_KIND" = dryrun ]; then
            FILMCRAFT_KEY_ALIAS=filmcraft-dryrun
            FILMCRAFT_KEYSTORE_PASSWORD=filmcraft-dryrun
            FILMCRAFT_KEY_PASSWORD=filmcraft-dryrun
            extra=(--v2-signing-enabled true --v3-signing-enabled true)
          else
            extra=(--v2-signing-enabled false --v3-signing-enabled true
              --lineage .github/signing/lightcraft-to-artcraft.lineage --rotation-min-sdk-version 28)
          fi
          for apk in dist/*.apk; do
            "$apksigner" sign --ks "$FILMCRAFT_KEYSTORE" --ks-key-alias "$FILMCRAFT_KEY_ALIAS" \
              --ks-pass env:FILMCRAFT_KEYSTORE_PASSWORD --key-pass env:FILMCRAFT_KEY_PASSWORD \
              --v1-signing-enabled false --v4-signing-enabled false --alignment-preserved true \
              "${extra[@]}" "$apk"
            "$apksigner" verify --verbose "$apk"
          done

      - name: APK
        env:
          KEY_KIND: ${{ steps.key.outputs.kind }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          echo >>"$GITHUB_STEP_SUMMARY"
          for apk in dist/*.apk; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            label=" (dry run, public test key)"
            if [ "$KEY_KIND" = release ]; then
              label=""
              # the lineage must name v0.0.1-beta's key, or installed copies can't update
              if ! "$apksigner" lineage --in "$apk" --print-certs | grep -q "CN=LightCraft for Android"; then
                echo "::error::$apk has no lineage from the old key"
                exit 1
              fi
            fi
            sha="$(sha256sum "$apk" | cut -d' ' -f1)"
            {
              echo "    $(basename "$apk")$label"
              grep "certificate SHA-256" <<<"$certs" | sed 's/^/      /'
              echo "      sha256: $sha"
            } >>"$GITHUB_STEP_SUMMARY"
            # Also an annotation: the summary is only on the run page, this is readable from the
            # API and from the file list, so the signing identity is easy to check.
            who="$(sed -n 's/.*certificate DN: //p' <<<"$certs" | head -n 1)"
            fp="$(sed -n 's/.*certificate SHA-256 digest: //p' <<<"$certs" | head -n 1)"
            echo "::notice title=APK signed$label::$(basename "$apk") — $who — cert SHA-256 $fp — APK SHA-256 $sha"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: dist/*
          if-no-files-found: error

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

  release:
    name: GitHub Release
    needs: apk
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: dist

      - name: Draft the release
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "## What's Changed" -- dist/*
          echo "Draft **$GITHUB_REF_NAME** is ready: fill in What's Changed and publish it." >>"$GITHUB_STEP_SUMMARY"
