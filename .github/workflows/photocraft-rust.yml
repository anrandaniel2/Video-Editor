# Temporary diagnostic: build :photocraft's Rust half on its own, so the release build's failures
# are readable (the Release workflow's APK log window drops them).
name: PhotoCraft Rust

on:
  push:
    branches:
      - 'arena/aa65d60d-video-editor'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null

      # Type-check on the host first: the Android cross-build takes ten minutes, so a signature
      # error is worth finding in two. Android-only code (android_logger) is behind cfg, so the
      # crate still checks on Linux.
      - name: Type-check on the host
        working-directory: third_party/photocraft
        run: |
          set +e
          cargo check --release -p photocraft-android --lib > /tmp/photocraft-check.log 2>&1
          rc=$?
          tail -40 /tmp/photocraft-check.log
          if [ "$rc" -ne 0 ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/build-log-annotations.py" /tmp/photocraft-check.log 4000
            exit "$rc"
          fi

      # The run's own log can't be read back in this environment, so a failure is reported as an
      # annotation: the last lines of the build, where Cargo puts its error.
      - name: Build the engine library
        working-directory: third_party/photocraft
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          set +e
          cargo ndk -t arm64-v8a --platform 28 -o /tmp/jni build --release -p photocraft-android --lib > /tmp/photocraft-build.log 2>&1
          rc=$?
          tail -60 /tmp/photocraft-build.log
          if [ "$rc" -ne 0 ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/build-log-annotations.py" /tmp/photocraft-build.log 9000
            exit "$rc"
          fi
