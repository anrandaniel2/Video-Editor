[package]
name = "photocraft-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The session the FilmCraft Android app drives: PhotoCraft's engine behind UniFFI, with the Kotlin bindings the Compose UI uses"

[lib]
name = "photocraft_android"
# cdylib: the library the Android app loads; lib: the desktop app and the tests
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
photocraft-engine = { workspace = true }
photocraft-compose = { workspace = true }
photocraft-io = { workspace = true }
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
photocraft-raster = { workspace = true }
photocraft-algo = { workspace = true }
photocraft-codecs = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# The exact version: the Kotlin bindings are generated by the same release (bindgen/, sharing this
# lock file) and refuse to load against another one.
uniffi = { version = "=0.32.2", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.15", default-features = false }
