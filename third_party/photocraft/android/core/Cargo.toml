[package]
name = "photocraft-android-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The Android bridge to PhotoCraft's engine: a document opened from its bytes, its layer stack and its composited pixels, for the Kotlin app (UniFFI)"

[lib]
name = "photocraft_core"
# cdylib: the library the Android app loads; lib: the bindgen crate and the tests.
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
photocraft-compose = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-io = { workspace = true }
thiserror = { workspace = true }
# The exact version: the Kotlin bindings are generated by the same release (android/bindgen,
# sharing this lock file) and refuse to load against another.
uniffi = { workspace = true }
