[package]
name = "photocraft-bindgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "uniffi-bindgen for photocraft-android-core: generates its Kotlin bindings from the built library (the Android build runs it)"

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The release photocraft-android-core uses (same lock file): bindings only load against their own.
uniffi = { version = "=0.32.2", features = ["cli"] }
