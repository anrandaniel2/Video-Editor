[package]
name = "filmcraft-media"
description = "Media sources: probing, decoding traits, frame cache, generators, stills"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmcraft-time = { workspace = true }
filmcraft-color = { workspace = true }
filmcraft-frame = { workspace = true }
filmcraft-dng = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "ico", "pnm", "qoi", "farbfeld", "dds", "exr", "hdr"] }

# Native still decoders: no Android codec/plugin requirement.
jxl-oxide = { version = "=0.12.6", features = ["image"] }
resvg = { version = "=0.45.1", default-features = false, features = ["text", "system-fonts", "raster-images"] }

[dev-dependencies]
filmcraft-testkit = { workspace = true }
filmcraft-dng = { workspace = true, features = ["writer"] }
# APNG fixtures for the animated-image tests (the image crate does not encode APNG)
png = "0.18"
